server.port=8080

# Application Name
spring.application.name=sharespare-backend

# Database Configuration (H2 memory for dev/test execution, easily switchable to MySQL)
spring.datasource.url=jdbc:h2:mem:sharespare_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Configuration (To use MySQL, set SPRING_PROFILES_ACTIVE=mysql or un-comment below)
# spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sharespare_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
# spring.datasource.username=${DB_USERNAME:root}
# spring.datasource.password=${DB_PASSWORD:root}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT Security Configurations
sharespare.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
sharespare.app.jwtExpirationMs=86400000

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
